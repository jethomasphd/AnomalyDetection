name: Cool Runnings — Google Spam Rate Detection

on:
  push:
    branches:
      - main
    paths:
      - 'Postmaster/Postmaster.csv'
  workflow_dispatch:
    inputs:
      sensitivity:
        description: 'Detection sensitivity'
        required: false
        default: 'medium'
        type: choice
        options:
          - low
          - medium
          - high
      domains:
        description: 'Comma-separated domains (leave empty for auto-discover)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  detect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Postmaster
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: Postmaster/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run spam rate anomaly detection
        run: |
          python -m spam_detection \
            --sensitivity "${{ github.event.inputs.sensitivity || 'medium' }}" \
            ${{ github.event.inputs.domains && format('--domains "{0}"', github.event.inputs.domains) || '' }}

      - name: Copy dashboard to Pages directory
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p docs/spam-rate
          cp Postmaster/docs/index.html docs/spam-rate/index.html

      - name: Commit results
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Postmaster/docs/ Postmaster/data/ docs/spam-rate/
          git diff --staged --quiet || git commit -m "Update Cool Runnings spam rate results [$(date -u +%Y-%m-%d)]"
          git push

  deploy-pages:
    needs: detect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Pull latest
        run: git pull origin ${{ github.ref_name }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
