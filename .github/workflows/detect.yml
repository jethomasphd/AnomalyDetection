name: Stock Anomaly Detection

on:
  schedule:
    # Run every weekday at 10:00 PM UTC, safely after the US market close
    # (20:00 UTC during EDT, 21:00 UTC during EST) so today's closing bar is available.
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated tickers (leave empty for defaults)'
        required: false
        default: ''
      sensitivity:
        description: 'Detection sensitivity'
        required: false
        default: 'medium'
        type: choice
        options:
          - low
          - medium
          - high
      start_date:
        description: 'Anchor date (YYYY-MM-DD) — backtest and detection run from here forward'
        required: false
        default: '2024-11-01'
      reset:
        description: 'Wipe the durable store and ledger before running (use after detection-regime changes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Never let two runs race each other's commits: the ledger is append-only
# and a concurrent push would force-fail one side.
concurrency:
  group: anomaly-detection
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (causality invariant, detectors, backtest, storage)
        run: |
          pip install pytest
          python -m pytest anomaly_detection/tests/ -q -x

      - name: Run anomaly detection
        run: |
          python -m anomaly_detection.pipeline \
            --skip-validation \
            --sensitivity "${{ github.event.inputs.sensitivity || 'medium' }}" \
            --start-date "${{ github.event.inputs.start_date || '2024-11-01' }}" \
            ${{ github.event.inputs.reset == 'true' && '--reset' || '' }} \
            ${{ github.event.inputs.tickers && format('--tickers "{0}"', github.event.inputs.tickers) || '' }}

      - name: Commit results (dashboard, alerts view, LEDGER, health, history)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/alerts.json data/ledger/ data/run_health.json data/history/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update anomaly detection results [$(date -u +%Y-%m-%d)]"
          # Pull-rebase + retry in case anything landed while we ran.
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((2 ** i))
          done
          git push

  deploy-pages:
    needs: detect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Pull latest
        run: git pull origin ${{ github.ref_name }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
