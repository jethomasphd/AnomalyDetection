name: Email Click Anomaly Detection

on:
  push:
    paths:
      - 'RGDelivery/data.csv'
  workflow_dispatch:
    inputs:
      sensitivity:
        description: 'Detection sensitivity'
        required: false
        default: 'medium'
        type: choice
        options:
          - low
          - medium
          - high
      domains:
        description: 'Comma-separated domains (leave empty for auto-discover)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  detect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RGDelivery
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: RGDelivery/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run email anomaly detection
        run: |
          python -m email_anomaly \
            --sensitivity "${{ github.event.inputs.sensitivity || 'medium' }}" \
            ${{ github.event.inputs.domains && format('--domains "{0}"', github.event.inputs.domains) || '' }}

      - name: Commit results
        run: |
          cd ${{ github.workspace }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add RGDelivery/docs/ RGDelivery/data/
          git diff --staged --quiet || git commit -m "Update email click anomaly results [$(date -u +%Y-%m-%d)]"
          git push
